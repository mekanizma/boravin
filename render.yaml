# BORAVIN — Render Blueprint
# Web + uploads disk. Veritabanı ve Auth: Supabase (Render Postgres yok).

services:
  - type: web
    name: boravin
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start:render
    healthCheckPath: /
    disk:
      name: boravin-uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "0"
      # Supabase Session Pooler — Dashboard'da kendi .env.local değerini yapıştır
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: boravin
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_URL
        fromService:
          name: boravin
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_BUCKET
        value: boravin-media
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SHIPPING_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      - key: ANALYTICS_PROVIDER
        value: internal
      - key: AI_PROVIDER
        value: gemini
      - key: AI_IMAGE_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: BARCODE_GOOGLE_HEADLESS
        value: "0"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "60"
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: tr
      - key: NEXT_PUBLIC_DEFAULT_CURRENCY
        value: TRY
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PROJECT
        sync: false
